// ==================== 调整时间弹窗 ====================
function showAdjustTimeModal(taskId, targetDate, dragSource) {
  const t = calTasks.find(task => task.id === taskId);
  if (!t) return;

  adjustTimeCtx = {
    taskId: taskId,
    targetDate: targetDate,
    originalStart: t.startHour,
    originalDuration: parseFloat(t.duration) || 1,
    dragSource: dragSource,
  };

  const dur = adjustTimeCtx.originalDuration;
  const startH = adjustTimeCtx.originalStart;
  const endH = startH + dur;

  const dateParts = targetDate.split('-').map(Number);
  const dateLabel = `${dateParts[0]}年${dateParts[1]}月${dateParts[2]}日`;
  document.getElementById('adjMessage').innerHTML =
    `「${escHtml(t.name)}」移动到 <strong>${dateLabel}</strong> 时，该时间段已被占用。<br>请调整新的时间：`;

  const occupied = getOccupiedHoursExclude(targetDate, taskId);

  const startSel = document.getElementById('adjStartHour');
  startSel.innerHTML = '';
  for (let i = 0; i < 48; i++) {
    const val = i * 0.5;
    const h = Math.floor(val); const mm = val % 1 === 0 ? '00' : '30';
    const opt = document.createElement('option');
    opt.value = val;
    const occupiedMark = occupied.has(val) ? ' ⛔' : '';
    opt.textContent = `${String(h).padStart(2,'0')}:${mm}${occupiedMark}`;
    if (Math.abs(val - startH) < 0.01) opt.selected = true;
    startSel.appendChild(opt);
  }

  const endSel = document.getElementById('adjEndHour');
  endSel.innerHTML = '';
  DURATION_OPTIONS.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d.value;
    opt.textContent = d.label;
    if (Math.abs(d.value - (endH - startH)) < 0.01) opt.selected = true;
    endSel.appendChild(opt);
  });

  updateAdjOccupiedHint(occupied);

  document.getElementById('adjustTimeOverlay').classList.add('show');
}

function getOccupiedHoursExclude(dateStr, excludeTaskId) {
  const occupied = new Set();
  if (!dateStr) return occupied;
  const [y, m, d] = dateStr.split('-').map(Number);
  const dayTasks = calTasks.filter(t =>
    t.year === y && t.month === m && t.day === d && t.id !== excludeTaskId
  );
  dayTasks.forEach(t => {
    const start = t.startHour;
    const dur = parseFloat(t.duration) || 1;
    for (let s = start; s < start + dur; s += 0.5) {
      occupied.add(s);
    }
  });
  return occupied;
}

function updateAdjOccupiedHint(occupied) {
  const hint = document.getElementById('adjOccupiedHint');
  if (occupied.size > 0) {
    const occupiedList = Array.from(occupied).sort((a, b) => a - b)
      .map(v => { const h=Math.floor(v),m=v%1===0?'00':'30'; return `${String(h).padStart(2,'0')}:${m}`; })
      .join('、');
    hint.innerHTML = `⛔ 已占用：${occupiedList}`;
  } else {
    hint.innerHTML = '';
  }
}

function cancelAdjustTime() {
  document.getElementById('adjustTimeOverlay').classList.remove('show');
  adjustTimeCtx = { taskId: null, targetDate: null, originalStart: 0, originalDuration: 1, dragSource: null };
  draggedId = null; dragType = null;
  onDragEnd();
}

function confirmAdjustTime() {
  const taskId = adjustTimeCtx.taskId;
  const targetDate = adjustTimeCtx.targetDate;
  if (!taskId || !targetDate) {
    cancelAdjustTime(); return;
  }

  const t = calTasks.find(task => task.id === taskId);
  if (!t) { cancelAdjustTime(); return; }

  const newStartH = parseFloat(document.getElementById('adjStartHour').value);
  const newDur    = parseFloat(document.getElementById('adjEndHour').value);
  const newEndH   = newStartH + newDur;

  if (newDur <= 0) {
    alert('请选择有效时长'); return;
  }

  const fmt = v => { const h=Math.floor(v),m=v%1===0?'00':'30'; return `${String(h).padStart(2,'0')}:${m}`; };
  const conflictTask = checkTimeConflict30(targetDate, newStartH, newEndH, taskId);
  if (conflictTask) {
    const cs = fmt(conflictTask.startHour);
    const ce = fmt(conflictTask.startHour + (parseFloat(conflictTask.duration) || 1));
    alert(`❌ 仍存在冲突！\n\n该时间段已被「${conflictTask.name}」占用\n（${cs} - ${ce}）\n\n请选择其它时间段。`);
    return;
  }

  const [y, m, day] = targetDate.split('-').map(Number);
  t.year = y; t.month = m; t.day = day;
  t.startHour = newStartH;
  t.duration = newDur;

  document.getElementById('adjustTimeOverlay').classList.remove('show');
  adjustTimeCtx = { taskId: null, targetDate: null, originalStart: 0, originalDuration: 1, dragSource: null };
  draggedId = null; dragType = null;

  saveData();
  render();
  refreshDayViewIfOpen();

  if (targetDate) {
    const [y, m, d] = targetDate.split('-').map(Number);
    setTimeout(() => {
      const cell = document.querySelector(`.day-cell[data-day="${d}"]`);
      if (cell) { cell.classList.add('drop-success'); setTimeout(() => cell.classList.remove('drop-success'), 500); }
      const block = document.querySelector(`.dv-task-block[data-task-id="${taskId}"]`);
      if (block) { block.classList.add('drop-success'); setTimeout(() => block.classList.remove('drop-success'), 300); }
    }, 50);
  }
}

function confirmModal() {
  const name = document.getElementById('modalTaskName').value.trim();
  if (!name) { alert('请输入任务名称'); return; }
  const dateStr  = document.getElementById('modalDate').value;
  const level    = document.getElementById('modalLevel').value;
  const note     = document.getElementById('modalNote').value.trim();
  const startH   = parseFloat(document.getElementById('modalStartHour').value);
  const dur      = parseFloat(document.getElementById('modalEndHour').value);
  const endH     = startH + dur;

  if (dur <= 0) {
    alert('请选择有效时长');
    return;
  }

  const conflictTask = checkTimeConflict30(dateStr, startH, endH);
  if (conflictTask) {
    const fmtH = v => { const h=Math.floor(v),m=v%1===0?'00':'30'; return `${String(h).padStart(2,'0')}:${m}`; };
    const cs = fmtH(conflictTask.startHour);
    const ce = fmtH(conflictTask.startHour + (parseFloat(conflictTask.duration) || 1));
    alert(`❌ 时间冲突！\n\n该时间段已被「${conflictTask.name}」占用\n（${cs} - ${ce}）\n\n请选择其它时间段。`);
    return;
  }

  let year = currentYear, month = currentMonth, day = null;
  if (dateStr) { [year, month, day] = dateStr.split('-').map(Number); }

  // Plan 绑定：优先使用下拉框选择，其次按名称匹配
  let planId = null;
  const planSel = document.getElementById('modalPlanId');
  if (planSel && planSel.value) {
    planId = parseInt(planSel.value);
  } else {
    const matched = mainTasks.find(m => m.name === name);
    if (matched) planId = matched.id;
  }

  const finalSubtasks = modalSubtasks
    .filter(s => s.name.trim() !== '')
    .map((s, i) => ({ id: nextId + i, name: s.name.trim(), done: false }));
  nextId += finalSubtasks.length;

  calTasks.push({
    id: nextId++, name, level, note, done: false,
    year, month, day,
    startHour: startH,
    duration: dur,
    mainTaskId: planId,
    subtasks: finalSubtasks,
  });

  closeModal();
  modalEditDate = null;
  render(); saveData();
  // 若日视图仍打开，刷新时间轴显示新增任务
  refreshDayViewIfOpen();
}

// ==================== 切换月份 ====================
function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 12) { currentMonth = 1;  currentYear++; }
  if (currentMonth < 1)  { currentMonth = 12; currentYear--; }
  renderCalendar(); renderStats();
}

/**
 * 点击「今日」按钮：将月历切换到今天所在月份，并高亮今天
 * 若今天已在当前视图则保持不变，只刷新高亮
 */
function goToToday() {
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth() + 1; // JS month is 0-indexed

  // 若当前不在今天所在月份，先切换
  if (y !== currentYear || m !== currentMonth) {
    currentYear  = y;
    currentMonth = m;
  }
  // 始终刷新日历，确保今日高亮正确
  renderCalendar();
  renderStats();
  showToast(`📅 已回到 ${y}年${m}月${now.getDate()}日`, '#667eea');
}

// ==================== 拖拽系统 ====================
let draggedId     = null;
let dragType      = null;

function onMainTaskDragStart(e, id) {
  draggedId = id; dragType = 'main';
  e.dataTransfer.effectAllowed = 'copy';
  setTimeout(() => { const el = document.getElementById(`mt-${id}`); if (el) el.classList.add('dragging'); }, 0);
}

function onCalTaskDragStart(e, id) {
  draggedId = id; dragType = 'cal';
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => {
    let el = e.currentTarget;
    if (!el || !el.classList) {
      el = document.querySelector(`[data-task-id="${id}"]`);
    }
    if (el && el.classList) el.classList.add('dragging');
  }, 0);
}

function onMonthTaskDragStart(e, taskId, day) {
  draggedId = taskId; dragType = 'cal';
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => {
    const items = document.querySelectorAll('.day-summary-item[data-task-id]');
    items.forEach(item => {
      if (parseInt(item.dataset.taskId) === taskId) {
        item.classList.add('dragging');
      }
    });
  }, 0);
}

function onDragEnd(e) {
  document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
  document.querySelectorAll('.drag-over-cell').forEach(el => el.classList.remove('drag-over-cell'));
  document.querySelectorAll('.drag-preview').forEach(el => el.remove());
  document.getElementById('taskPanel').classList.remove('drag-over');
}

function onDayCellDragOver(e, day) {
  e.preventDefault();
  e.dataTransfer.dropEffect = dragType === 'main' ? 'copy' : 'move';
  const cell = e.currentTarget;
  if (!cell.classList.contains('drag-over-cell')) {
    document.querySelectorAll('.drag-over-cell').forEach(el => el.classList.remove('drag-over-cell'));
    cell.classList.add('drag-over-cell');
  }
}

function onDayCellDragLeave(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) {
    e.currentTarget.classList.remove('drag-over-cell');
  }
}

function onDropToDay(e, day) {
  e.preventDefault();
  e.stopPropagation();
  document.querySelectorAll('.drag-over-cell').forEach(el => el.classList.remove('drag-over-cell'));
  if (draggedId === null) return;

  const targetDate = `${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

  if (dragType === 'main') {
    const src = mainTasks.find(t => t.id === draggedId);
    if (!src) { draggedId = null; dragType = null; return; }

    const conflictTask = checkTimeConflict30(targetDate, 9, 10);
    if (conflictTask) {
      showAdjustTimeModalForNew(src, targetDate, day);
    } else {
      const newTaskId = nextId++;
      calTasks.push({
        id: newTaskId, name: src.name, level: src.level, note: src.note, done: false,
        year: currentYear, month: currentMonth, day,
        startHour: 9, duration: 1, mainTaskId: src.id,
        subtasks: [],
      });
      render(); saveData();
      setTimeout(() => {
        const cell = document.querySelector(`.day-cell[data-day="${day}"]`);
        if (cell) { cell.classList.add('drop-success'); setTimeout(() => cell.classList.remove('drop-success'), 500); }
      }, 10);
    }
  } else if (dragType === 'cal') {
    const t = calTasks.find(task => task.id === draggedId);
    if (!t) { draggedId = null; dragType = null; return; }

    const dur = parseFloat(t.duration) || 1;
    const newStartH = t.startHour;
    const newEndH = newStartH + dur;

    const conflictTask = checkTimeConflict30(targetDate, newStartH, newEndH, draggedId);
    if (conflictTask) {
      showAdjustTimeModal(draggedId, targetDate, 'month');
    } else {
      const [y, m, d] = targetDate.split('-').map(Number);
      t.year = y; t.month = m; t.day = d;
      saveData();
      render();
      refreshDayViewIfOpen();
      setTimeout(() => {
        const cell = document.querySelector(`.day-cell[data-day="${d}"]`);
        if (cell) { cell.classList.add('drop-success'); setTimeout(() => cell.classList.remove('drop-success'), 500); }
      }, 10);
    }
  }

  draggedId = null; dragType = null;
  onDragEnd();
}

let pendingNewTask = null;

function showAdjustTimeModalForNew(mainTaskSrc, targetDate, day) {
  pendingNewTask = { mainTaskSrc, targetDate, day };
  const [y, m, d] = targetDate.split('-').map(Number);
  const dateLabel = `${y}年${m}月${d}日`;

  document.getElementById('adjMessage').innerHTML =
    `「${escHtml(mainTaskSrc.name)}」添加到 <strong>${dateLabel}</strong> 时，该时间段已被占用。<br>请调整新的时间：`;

  const occupied = getOccupiedHoursExclude(targetDate, null);

  const startSel = document.getElementById('adjStartHour');
  startSel.innerHTML = '';
  for (let i = 0; i < 48; i++) {
    const val = i * 0.5;
    const h = Math.floor(val); const mm = val % 1 === 0 ? '00' : '30';
    const opt = document.createElement('option');
    opt.value = val;
    const occupiedMark = occupied.has(val) ? ' ⛔' : '';
    opt.textContent = `${String(h).padStart(2,'0')}:${mm}${occupiedMark}`;
    if (val === 9) opt.selected = true;
    startSel.appendChild(opt);
  }

  const endSel = document.getElementById('adjEndHour');
  endSel.innerHTML = '';
  DURATION_OPTIONS.forEach(dd => {
    const opt = document.createElement('option');
    opt.value = dd.value;
    opt.textContent = dd.label;
    if (dd.value === 1) opt.selected = true;
    endSel.appendChild(opt);
  });

  updateAdjOccupiedHint(occupied);
  document.getElementById('adjustTimeOverlay').classList.add('show');
  window._originalConfirmAdj = confirmAdjustTime;
  window.confirmAdjustTime = confirmAdjustTimeForNew;
}

function confirmAdjustTimeForNew() {
  if (!pendingNewTask) { cancelAdjustTime(); return; }

  const { mainTaskSrc, targetDate, day } = pendingNewTask;
  const newStartH = parseFloat(document.getElementById('adjStartHour').value);
  const newDur    = parseFloat(document.getElementById('adjEndHour').value);
  const newEndH   = newStartH + newDur;

  if (newDur <= 0) {
    alert('请选择有效时长'); return;
  }

  const [y, m, d] = targetDate.split('-').map(Number);

  calTasks.push({
    id: nextId++, name: mainTaskSrc.name, level: mainTaskSrc.level, note: mainTaskSrc.note, done: false,
    year: y, month: m, day: d,
    startHour: newStartH, duration: newDur, mainTaskId: mainTaskSrc.id,
    subtasks: [],
  });

  window.confirmAdjustTime = window._originalConfirmAdj || confirmAdjustTime;
  pendingNewTask = null;

  document.getElementById('adjustTimeOverlay').classList.remove('show');
  adjustTimeCtx = { taskId: null, targetDate: null, originalStart: 0, originalDuration: 1, dragSource: null };
  draggedId = null; dragType = null;

  saveData();
  render();
  refreshDayViewIfOpen();

  if (targetDate) {
    const [y, m, d] = targetDate.split('-').map(Number);
    setTimeout(() => {
      const cell = document.querySelector(`.day-cell[data-day="${d}"]`);
      if (cell) { cell.classList.add('drop-success'); setTimeout(() => cell.classList.remove('drop-success'), 500); }
    }, 10);
  }
}

// 总任务区拖拽事件
function onPanelDragOver(e) {
  if (dragType !== 'cal') return;
  e.preventDefault();
  document.getElementById('taskPanel').classList.add('drag-over');
}

function onPanelDragLeave(e) {
  if (!document.getElementById('taskPanel').contains(e.relatedTarget)) {
    document.getElementById('taskPanel').classList.remove('drag-over');
  }
}

function onDropToPanel(e) {
  e.preventDefault();
  document.getElementById('taskPanel').classList.remove('drag-over');
  if (dragType !== 'cal' || draggedId === null) return;
  calTasks = calTasks.filter(t => t.id !== draggedId);
  draggedId = null; dragType = null;
  render(); saveData();
}

// ==================== Task Pool 待安排任务池 ====================
let dvPoolDragId = null;

// 渲染日视图左侧任务池
function renderDvPool() {
  const el = document.getElementById('dvPoolList');
  if (!el) return;
  if (!taskPool.length) {
    el.innerHTML = '<div style="text-align:center;color:#bbb;padding:12px 0;font-size:11px;">暂无待安排任务<br>可在上方输入框添加</div>';
    return;
  }
  el.innerHTML = taskPool.map(p => {
    const levelClass = `level-${p.level || 'yellow'}`;
    // 获取绑定 Plan 名称
    const mt = p.mainTaskId ? mainTasks.find(m => m.id === p.mainTaskId) : null;
    const planHtml = mt ? `<div class="dv-pool-item-plan">🎯 ${escHtml(mt.name)}</div>` : '';
    return `<div class="dv-pool-item ${levelClass}" data-pool-id="${p.id}"
      draggable="true"
      ondragstart="onPoolItemDragStart(event, ${p.id})"
      ondragend="onDragEnd(event)">
      <div style="flex:1;min-width:0;">
        <div style="font-size:11px;color:#333;line-height:1.4;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${escHtml(p.name)}</div>
        ${planHtml}
      </div>
      <span class="dv-pool-item-del" onclick="deleteDvPoolTask(${p.id})" title="删除">×</span>
    </div>`;
  }).join('');
}

/**
 * 初始化日视图任务池中绑定 Plan 的下拉框
 */
function initDvPoolPlanSelect() {
  const sel = document.getElementById('dvPoolNewPlan');
  if (!sel) return;
  sel.innerHTML = '<option value="">— 不绑定 Plan —</option>';
  mainTasks.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.id;
    opt.textContent = m.name;
    sel.appendChild(opt);
  });
}

/**
 * 在日视图任务池中直接添加未安排任务
 */
function addDvPoolTask() {
  const nameEl = document.getElementById('dvPoolNewName');
  const name = nameEl ? nameEl.value.trim() : '';
  if (!name) { nameEl && nameEl.focus(); return; }

  const level = document.getElementById('dvPoolNewLevel').value || 'yellow';
  const planSel = document.getElementById('dvPoolNewPlan');
  const mainTaskId = planSel && planSel.value ? parseInt(planSel.value) : null;

  // 添加到 taskPool
  taskPool.push({ id: nextId++, name, level, note: '', mainTaskId });

  // 清空输入框
  nameEl.value = '';
  if (planSel) planSel.value = '';

  renderDvPool();
  saveData();
  nameEl.focus(); // 方便连续添加
}

/**
 * 在日视图中删除任务池条目
 */
function deleteDvPoolTask(id) {
  taskPool = taskPool.filter(p => p.id !== id);
  renderDvPool();
  saveData();
}

// 任务池项拖拽开始
function onPoolItemDragStart(e, id) {
  dvPoolDragId = id;
  dragType = 'pool';
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => {
    const el = document.querySelector(`.dv-pool-item[data-pool-id="${id}"]`);
    if (el) el.classList.add('dragging');
  }, 0);
}

// 日视图左侧池区域：时间轴拖回任务池
function onDvPoolDragOver(e) {
  if (dragType !== 'cal') return;
  e.preventDefault();
  document.getElementById('dvPoolCol').classList.add('drag-over-pool');
}

function onDvPoolDragLeave(e) {
  const col = document.getElementById('dvPoolCol');
  if (!col.contains(e.relatedTarget)) col.classList.remove('drag-over-pool');
}

function onDvPoolDrop(e) {
  e.preventDefault();
  document.getElementById('dvPoolCol').classList.remove('drag-over-pool');
  if (dragType !== 'cal' || draggedId === null) return;
  // 将已排期任务移回任务池
  const t = calTasks.find(task => task.id === draggedId);
  if (t) {
    taskPool.push({ id: nextId++, name: t.name, level: t.level, note: t.note || '', mainTaskId: t.mainTaskId || null });
    calTasks = calTasks.filter(task => task.id !== draggedId);
  }
  draggedId = null; dragType = null;
  saveData(); render(); refreshDayViewIfOpen();
}

// 任务池弹窗状态
let poolScheduleCtx = { poolId: null, dateStr: null, startH: null };

function openPoolSchedule(poolId, dateStr, startH) {
  const item = taskPool.find(p => p.id === poolId);
  if (!item) return;
  poolScheduleCtx = { poolId, dateStr, startH: startH || 9 };

  document.getElementById('poolScheduleTaskName').textContent = item.name;
  const [y, m, d] = dateStr.split('-').map(Number);
  document.getElementById('poolScheduleDate').textContent = `${y}年${m}月${d}日`;

  // 构建开始时间选择器
  const startSel = document.getElementById('poolScheduleStart');
  startSel.innerHTML = '';
  for (let i = 0; i < 48; i++) {
    const val = i * 0.5;
    const h = Math.floor(val); const mm = val % 1 === 0 ? '00' : '30';
    const opt = document.createElement('option');
    opt.value = val;
    opt.textContent = `${String(h).padStart(2,'0')}:${mm}`;
    if (Math.abs(val - (startH || 9)) < 0.01) opt.selected = true;
    startSel.appendChild(opt);
  }
  // 构建时长选择器
  const durSel = document.getElementById('poolScheduleDur');
  durSel.innerHTML = '';
  DURATION_OPTIONS.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d.value;
    opt.textContent = d.label;
    if (d.value === 1) opt.selected = true;
    durSel.appendChild(opt);
  });

  updatePoolSchedulePreview();
  startSel.onchange = updatePoolSchedulePreview;
  durSel.onchange = updatePoolSchedulePreview;

  dvPoolDragId = null; dragType = null;
  document.getElementById('poolScheduleOverlay').classList.add('show');
}

function updatePoolSchedulePreview() {
  const s = parseFloat(document.getElementById('poolScheduleStart').value);
  const d = parseFloat(document.getElementById('poolScheduleDur').value);
  const e = s + d;
  const fmt = v => { const h=Math.floor(v),m=v%1===0?'00':'30'; return `${String(h).padStart(2,'0')}:${m}`; };
  document.getElementById('poolSchedulePreview').textContent = `${fmt(s)} — ${fmt(e)}`;
  const conflict = checkTimeConflict30(poolScheduleCtx.dateStr, s, e);
  const conflictEl = document.getElementById('poolScheduleConflict');
  if (conflict) {
    conflictEl.textContent = `⛔ 与「${conflict.name}」时间冲突`;
    conflictEl.style.display = 'block';
  } else {
    conflictEl.style.display = 'none';
  }
}

function closePoolSchedule() {
  document.getElementById('poolScheduleOverlay').classList.remove('show');
  dvPoolDragId = null; dragType = null; poolScheduleCtx = { poolId: null, dateStr: null, startH: null };
}

function confirmPoolSchedule() {
  const { poolId, dateStr } = poolScheduleCtx;
  const item = taskPool.find(p => p.id === poolId);
  if (!item || !dateStr) { closePoolSchedule(); return; }

  const startH = parseFloat(document.getElementById('poolScheduleStart').value);
  const dur    = parseFloat(document.getElementById('poolScheduleDur').value);
  const endH   = startH + dur;

  const conflict = checkTimeConflict30(dateStr, startH, endH);
  if (conflict) {
    const fmt = v => { const h=Math.floor(v),m=v%1===0?'00':'30'; return `${String(h).padStart(2,'0')}:${m}`; };
    alert(`❌ 时间冲突！该时间段已被「${conflict.name}」占用\n(${fmt(conflict.startHour)} - ${fmt(conflict.startHour + parseFloat(conflict.duration))})\n请调整时间。`);
    return;
  }

  const [y, m, d] = dateStr.split('-').map(Number);
  calTasks.push({
    id: nextId++, name: item.name, level: item.level, note: item.note || '', done: false,
    year: y, month: m, day: d,
    startHour: startH, duration: dur,
    mainTaskId: item.mainTaskId || null,
    subtasks: [],
  });
  // 从任务池移除
  taskPool = taskPool.filter(p => p.id !== poolId);

  closePoolSchedule();
  saveData(); render(); refreshDayViewIfOpen();
}

// ==================== 数据持久化 ====================
function saveData() {
  try {
    localStorage.setItem('calendar_v4', JSON.stringify({
      mainTasks, calTasks, taskPool, nextId, currentYear, currentMonth
    }));
  } catch(e) { console.warn('localStorage write failed', e); }
}

function loadData() {
  try {
    const raw = localStorage.getItem('calendar_v4')
             || localStorage.getItem('calendar_v3')
             || localStorage.getItem('calendar_v2');
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.mainTasks) {
      mainTasks = d.mainTasks.map(m => {
        if (!m.deadline) m.deadline = null;
        return m;
      });
    }
    if (d.calTasks) {
      calTasks = d.calTasks.map(t => {
        if (t.duration === undefined && t.startHour !== undefined && t.endHour !== undefined) {
          t.duration = Math.max(0.5, t.endHour - t.startHour);
        }
        if (t.duration === undefined) t.duration = 1;
        if (!Array.isArray(t.subtasks)) t.subtasks = [];
        return t;
      });
    }
    if (Array.isArray(d.taskPool)) taskPool = d.taskPool;
    if (d.nextId)       nextId       = d.nextId;
    if (d.currentYear)  currentYear  = d.currentYear;
    if (d.currentMonth) currentMonth = d.currentMonth;
    render();
  } catch(e) { console.warn('localStorage read failed', e); }
}

// ==================== 工具函数 ====================
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Toast 通知
function showToast(msg, color = '#333') {
  const toast = document.createElement('div');
  toast.style.cssText = `
    position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
    background:${color};color:white;padding:12px 24px;border-radius:30px;
    font-size:15px;font-weight:600;z-index:99999;
    box-shadow:0 4px 20px rgba(0,0,0,0.2);
    animation:toastIn 0.3s ease,toastOut 0.3s ease 2.5s forwards;
    white-space:nowrap;
  `;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// 启动
init();
</script>
